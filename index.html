<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opera Sales Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #161920;
  --surface2: #1e2230;
  --border: #2a2f3d;
  --text: #e8eaf0;
  --muted: #7a8099;
  --accent: #4f7fff;
  --accent2: #7c5cfc;
  --green: #34d399;
  --red: #f87171;
  --yellow: #fbbf24;
  --orange: #fb923c;
  --cyan: #22d3ee;
  --pink: #f472b6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── HEADER ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 32px; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
#updated { font-size: 12px; color: var(--muted); }

/* ── MAIN NAV ── */
.main-nav {
  display: flex; gap: 4px; padding: 16px 32px 0;
  border-bottom: 1px solid var(--border); background: var(--surface);
  overflow-x: auto;
}
.main-nav button {
  padding: 10px 20px; border: none; background: none; color: var(--muted);
  font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap; transition: all .2s; font-family: inherit;
}
.main-nav button:hover { color: var(--text); }
.main-nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── CONTENT ── */
.content { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

/* ── KPI CARDS ── */
.kpi-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px;
}
.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; transition: border-color .2s;
}
.kpi-card:hover { border-color: var(--accent); }
.kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
.kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -1px; }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.kpi-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
.kpi-badge.up { background: rgba(52,211,153,.15); color: var(--green); }
.kpi-badge.down { background: rgba(248,113,113,.15); color: var(--red); }

/* ── SECTION TITLE ── */
.section-title { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 16px; }

/* ── PERIOD TABS ── */
.period-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.period-tabs button {
  padding: 7px 18px; border: 1px solid var(--border); border-radius: 8px;
  background: none; color: var(--muted); font-size: 13px; cursor: pointer; font-family: inherit; transition: all .2s;
}
.period-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── SEGMENT FILTER ── */
.seg-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.seg-btn {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: none; color: var(--muted); font-size: 12px; cursor: pointer; font-family: inherit; transition: all .2s;
}
.seg-btn:hover { border-color: var(--text); color: var(--text); }
.seg-btn.active { border-color: transparent; color: #fff; }

/* ── CHART CARDS ── */
.chart-grid { display: grid; gap: 20px; }
.chart-grid.cols2 { grid-template-columns: 1fr 1fr; }
.chart-grid.cols3 { grid-template-columns: 2fr 1fr; }
.chart-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
}
.chart-card h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: .5px; }
.chart-wrap { position: relative; }

/* ── MTD PROGRESS ── */
.mtd-grid { display: grid; gap: 12px; }
.mtd-row { display: grid; grid-template-columns: 140px 1fr 80px 80px; align-items: center; gap: 16px; }
.mtd-name { font-size: 13px; font-weight: 500; }
.prog-bar-bg { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.prog-bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
.mtd-val { font-size: 12px; color: var(--muted); text-align: right; }
.mtd-pct { font-size: 13px; font-weight: 700; text-align: right; }

/* ── TABLE ── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 10px 14px; text-align: right; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
th:first-child { text-align: left; }
td { padding: 10px 14px; text-align: right; border-bottom: 1px solid rgba(42,47,61,.5); }
td:first-child { text-align: left; font-weight: 500; }
tr:hover td { background: var(--surface2); }
.pos { color: var(--green); }
.neg { color: var(--red); }

/* ── CHANNEL TABLE ── */
.ch-tbl th:first-child, .ch-tbl td:first-child { width: 180px; }

/* ── YOY COMPARE BAR ── */
.yoy-block { margin-top: 8px; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .chart-grid.cols2, .chart-grid.cols3 { grid-template-columns: 1fr; }
  .content { padding: 20px 16px; }
  header { padding: 14px 16px; }
  .main-nav { padding: 12px 16px 0; }
}

/* ── LOADING ── */
#loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--muted); z-index: 100;
}
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-right: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div>데이터 로딩 중...</div>

<header>
  <div class="logo">Opera <span>Sales</span></div>
  <div id="updated">—</div>
</header>

<nav class="main-nav">
  <button class="active" onclick="switchTab('summary')">전사 Summary</button>
  <button onclick="switchTab('dom_b2b')">국내 B2B</button>
  <button onclick="switchTab('dom_b2c')">국내 B2C</button>
  <button onclick="switchTab('ovs_b2b_direct')">해외 B2B 직수출</button>
  <button onclick="switchTab('ovs_b2b_indirect')">해외 B2B 간접</button>
  <button onclick="switchTab('ovs_b2c')">해외 B2C</button>
</nav>

<div class="content" id="main-content"></div>

<script>
let DATA = null;
let activeTab = 'summary';
let summaryPeriod = 'monthly';
let channelPeriod = 'monthly';
let activeSegs = new Set(['total','domestic','overseas','b2b_dom','b2c_dom','b2b_direct','b2b_indirect','b2c_ovs']);

// ── COLORS ──
const SEG_COLORS = {
  total:        '#4f7fff',
  domestic:     '#34d399',
  overseas:     '#f472b6',
  b2b_dom:      '#22d3ee',
  b2c_dom:      '#a78bfa',
  b2b_direct:   '#fbbf24',
  b2b_indirect: '#fb923c',
  b2c_ovs:      '#f87171',
};
const SEG_LABELS = {
  total:        '합계',
  domestic:     '국내',
  overseas:     '해외',
  b2b_dom:      '국내 B2B',
  b2c_dom:      '국내 B2C',
  b2b_direct:   '해외 B2B 직수출',
  b2b_indirect: '해외 B2B 간접',
  b2c_ovs:      '해외 B2C',
};
const CHANNEL_COLORS = ['#4f7fff','#34d399','#f472b6','#22d3ee','#a78bfa','#fbbf24','#fb923c','#f87171','#6ee7b7','#93c5fd','#fda4af','#fdba74','#c4b5fd','#86efac','#67e8f9','#fcd34d'];

function fmt(v, dec=0) {
  if (v == null || isNaN(v)) return '—';
  return v.toLocaleString('ko-KR', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function pctBadge(v) {
  if (v == null) return '';
  const cls = v >= 0 ? 'up' : 'down';
  const sign = v >= 0 ? '▲' : '▼';
  return `<span class="kpi-badge ${cls}">${sign} ${Math.abs(v).toFixed(1)}%</span>`;
}
function progColor(pct) {
  if (!pct) return '#4f7fff';
  if (pct >= 100) return '#34d399';
  if (pct >= 70) return '#4f7fff';
  if (pct >= 50) return '#fbbf24';
  return '#f87171';
}

// ── FETCH DATA ──
fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    DATA = d;
    document.getElementById('updated').textContent = '업데이트: ' + (d.updated_at || '—');
    document.getElementById('loading').style.display = 'none';
    renderTab('summary');
  })
  .catch(e => {
    document.getElementById('loading').innerHTML = '⚠️ 데이터를 불러올 수 없습니다.';
  });

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.main-nav button').forEach((b,i) => {
    const tabs = ['summary','dom_b2b','dom_b2c','ovs_b2b_direct','ovs_b2b_indirect','ovs_b2c'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  renderTab(tab);
}

function renderTab(tab) {
  if (tab === 'summary') renderSummary();
  else renderChannel(tab);
}

// ─────────────────────────────────────────────
// SUMMARY TAB
// ─────────────────────────────────────────────
function renderSummary() {
  const monthly = DATA.monthly;
  const weekly  = DATA.weekly;
  const mtd     = DATA.mtd;

  // KPI 계산
  const rec2026m = monthly.filter(m => m.year === 2026);
  const latestM  = rec2026m[rec2026m.length - 1];
  const sum2025  = monthly.filter(m => m.year === 2025).reduce((s,m) => s + m.total, 0);
  const sum2026  = rec2026m.reduce((s,m) => s + m.total, 0);
  const rec2026w = weekly.filter(w => w.year === 2026);
  const avgWeek  = rec2026w.length ? rec2026w.reduce((s,w) => s + w.total, 0) / rec2026w.length : 0;

  // 2025 같은기간 누계
  const months2026 = rec2026m.map(m => m.month);
  const sum2025same = monthly.filter(m => m.year === 2025 && months2026.includes(m.month)).reduce((s,m) => s + m.total, 0);
  const yoyPct = sum2025same ? ((sum2026 - sum2025same) / sum2025same * 100) : null;

  let html = `
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">최근월 매출</div>
      <div class="kpi-value">${latestM ? fmt(latestM.total) : '—'}<small style="font-size:14px;color:var(--muted)"> 백만</small></div>
      <div class="kpi-sub" style="margin-top:8px">${latestM ? latestM.label : ''} ${latestM?.mom != null ? pctBadge(latestM.mom) + ' MoM' : ''}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">2026 누계 매출</div>
      <div class="kpi-value">${fmt(sum2026)}<small style="font-size:14px;color:var(--muted)"> 백만</small></div>
      <div class="kpi-sub" style="margin-top:8px">vs 2025 동기간 ${pctBadge(yoyPct)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">MTD 달성률 (합계)</div>
      <div class="kpi-value" style="color:${progColor(mtd?.합계?.progress)}">${mtd?.합계?.progress != null ? mtd.합계.progress.toFixed(1) + '%' : '—'}</div>
      <div class="kpi-sub" style="margin-top:8px">MTD ${fmt(mtd?.합계?.mtd)} / 목표 ${fmt(mtd?.합계?.target)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">2026 주 평균</div>
      <div class="kpi-value">${fmt(avgWeek, 0)}<small style="font-size:14px;color:var(--muted)"> 백만</small></div>
      <div class="kpi-sub" style="margin-top:8px">${rec2026w.length}주 기준</div>
    </div>
  </div>

  <!-- MTD -->
  <div class="chart-card" style="margin-bottom:20px">
    <h3>MTD 목표 달성 현황</h3>
    <div class="mtd-grid">
  `;
  const mtdOrder = ['합계','국내','B2B(국내)','B2C(국내)','해외','B2B직수출','B2B간접수출','B2C(해외)'];
  mtdOrder.forEach(key => {
    const d = mtd[key];
    if (!d) return;
    const pct = d.progress || 0;
    html += `
    <div class="mtd-row">
      <div class="mtd-name">${key}</div>
      <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${Math.min(pct,100)}%;background:${progColor(pct)}"></div></div>
      <div class="mtd-val">${fmt(d.mtd)} / ${fmt(d.target)}</div>
      <div class="mtd-pct" style="color:${progColor(pct)}">${pct ? pct.toFixed(1)+'%' : '—'}</div>
    </div>`;
  });
  html += `</div></div>`;

  // Period selector
  html += `
  <div class="period-tabs" id="period-tabs">
    <button class="${summaryPeriod==='monthly'?'active':''}" onclick="setSummaryPeriod('monthly')">월별</button>
    <button class="${summaryPeriod==='weekly'?'active':''}" onclick="setSummaryPeriod('weekly')">주별</button>
  </div>

  <!-- Segment filter -->
  <div class="seg-filter" id="seg-filter">
  `;
  const summarySegs = ['total','domestic','overseas','b2b_dom','b2c_dom','b2b_direct','b2b_indirect','b2c_ovs'];
  summarySegs.forEach(s => {
    const on = activeSegs.has(s);
    html += `<button class="seg-btn${on?' active':''}" style="${on?'background:'+SEG_COLORS[s]+';border-color:'+SEG_COLORS[s]:''}" onclick="toggleSeg('${s}')">${SEG_LABELS[s]}</button>`;
  });
  html += `</div>`;

  // Charts
  html += `
  <div class="chart-grid" style="margin-bottom:20px">
    <div class="chart-card">
      <h3 id="trend-title">${summaryPeriod==='monthly'?'월별':'주별'} 매출 추이</h3>
      <div class="chart-wrap" style="height:320px"><canvas id="trendChart"></canvas></div>
    </div>
  </div>
  <div class="chart-grid cols2" style="margin-bottom:20px">
    <div class="chart-card">
      <h3>2025 vs 2026 누계 비교 (월 기준)</h3>
      <div class="chart-wrap" style="height:280px"><canvas id="yoyChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>국내/해외 비중</h3>
      <div class="chart-wrap" style="height:280px"><canvas id="donutChart"></canvas></div>
    </div>
  </div>

  <!-- Detail table -->
  <div class="chart-card">
    <h3 id="tbl-title">${summaryPeriod==='monthly'?'월별':'주별'} 상세 데이터</h3>
    <div class="tbl-wrap" id="detail-table"></div>
  </div>
  `;

  document.getElementById('main-content').innerHTML = html;
  drawSummaryCharts();
}

function setSummaryPeriod(p) {
  summaryPeriod = p;
  document.querySelectorAll('#period-tabs button').forEach((b,i) => b.classList.toggle('active', i===(p==='monthly'?0:1)));
  document.getElementById('trend-title').textContent = (p==='monthly'?'월별':'주별') + ' 매출 추이';
  document.getElementById('tbl-title').textContent = (p==='monthly'?'월별':'주별') + ' 상세 데이터';
  drawSummaryCharts();
}

function toggleSeg(s) {
  if (activeSegs.has(s)) { if (activeSegs.size > 1) activeSegs.delete(s); }
  else activeSegs.add(s);
  document.querySelectorAll('.seg-btn').forEach(b => {
    const key = b.getAttribute('onclick').match(/'(\w+)'/)[1];
    const on = activeSegs.has(key);
    b.classList.toggle('active', on);
    b.style.background = on ? SEG_COLORS[key] : '';
    b.style.borderColor = on ? SEG_COLORS[key] : '';
  });
  drawSummaryCharts();
}

let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function drawSummaryCharts() {
  const isMonthly = summaryPeriod === 'monthly';
  const rows = isMonthly ? DATA.monthly : DATA.weekly;
  const labels = rows.map(r => isMonthly ? r.label : r.label);

  // ── Trend chart ──
  destroyChart('trendChart');
  const segsToShow = ['total','domestic','overseas','b2b_dom','b2c_dom','b2b_direct','b2b_indirect','b2c_ovs']
    .filter(s => activeSegs.has(s));

  const datasets = segsToShow.map(s => ({
    label: SEG_LABELS[s],
    data: rows.map(r => r[s] || 0),
    borderColor: SEG_COLORS[s],
    backgroundColor: SEG_COLORS[s] + '22',
    tension: .35, fill: false,
    pointRadius: 3, pointHoverRadius: 6,
    borderWidth: 2,
  }));

  charts['trendChart'] = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels, datasets },
    options: chartOpts(),
  });

  // ── YoY compare ──
  destroyChart('yoyChart');
  const months25 = DATA.monthly.filter(m => m.year===2025).sort((a,b)=>a.month-b.month);
  const months26 = DATA.monthly.filter(m => m.year===2026).sort((a,b)=>a.month-b.month);
  const maxMo = Math.max(...months26.map(m=>m.month));
  const yoyLabels = Array.from({length:maxMo}, (_,i) => (i+1)+'월');
  charts['yoyChart'] = new Chart(document.getElementById('yoyChart'), {
    type: 'bar',
    data: {
      labels: yoyLabels,
      datasets: [
        { label: '2025', data: yoyLabels.map((_,i)=>{ const m=months25.find(x=>x.month===i+1); return m?m.total:0; }), backgroundColor: '#2a2f3d', borderRadius:4 },
        { label: '2026', data: yoyLabels.map((_,i)=>{ const m=months26.find(x=>x.month===i+1); return m?m.total:0; }), backgroundColor: '#4f7fff', borderRadius:4 },
      ]
    },
    options: { ...chartOpts(), plugins: { legend: { display:true, labels:{ color:'#7a8099', font:{size:11} } } } },
  });

  // ── Donut ──
  destroyChart('donutChart');
  const latest = DATA.monthly.filter(m=>m.year===2026);
  const domSum = latest.reduce((s,m)=>s+(m.domestic||0),0);
  const ovsSum = latest.reduce((s,m)=>s+(m.overseas||0),0);
  charts['donutChart'] = new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: {
      labels: ['국내','해외'],
      datasets: [{ data: [domSum, ovsSum], backgroundColor: ['#34d399','#f472b6'], borderWidth:0, hoverOffset:8 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false, cutout:'68%',
      plugins: { legend: { position:'bottom', labels:{ color:'#7a8099', padding:16, font:{size:12} } }, tooltip:{ callbacks:{ label: ctx => ' ' + fmt(ctx.raw) + ' 백만' } } }
    }
  });

  // ── Detail table ──
  let thtml = '<table>';
  if (isMonthly) {
    thtml += '<tr><th>기간</th><th>합계</th><th>국내</th><th>국내B2B</th><th>국내B2C</th><th>해외</th><th>해외B2B직</th><th>해외B2B간</th><th>해외B2C</th><th>MoM</th><th>YoY</th></tr>';
    [...DATA.monthly].reverse().forEach(m => {
      thtml += `<tr>
        <td>${m.label}</td>
        <td>${fmt(m.total)}</td>
        <td>${fmt(m.domestic)}</td>
        <td>${fmt(m.b2b_dom)}</td>
        <td>${fmt(m.b2c_dom)}</td>
        <td>${fmt(m.overseas)}</td>
        <td>${fmt(m.b2b_direct)}</td>
        <td>${fmt(m.b2b_indirect)}</td>
        <td>${fmt(m.b2c_ovs)}</td>
        <td class="${m.mom>=0?'pos':'neg'}">${m.mom!=null?(m.mom>=0?'+':'')+m.mom.toFixed(1)+'%':'—'}</td>
        <td class="${m.yoy>=0?'pos':'neg'}">${m.yoy!=null?(m.yoy>=0?'+':'')+m.yoy.toFixed(1)+'%':'—'}</td>
      </tr>`;
    });
  } else {
    thtml += '<tr><th>주차</th><th>합계</th><th>국내</th><th>국내B2B</th><th>국내B2C</th><th>해외</th><th>해외B2B직</th><th>해외B2B간</th><th>해외B2C</th></tr>';
    [...DATA.weekly].reverse().forEach(w => {
      thtml += `<tr>
        <td>${w.label}</td>
        <td>${fmt(w.total)}</td>
        <td>${fmt(w.domestic)}</td>
        <td>${fmt(w.b2b_dom||0)}</td>
        <td>${fmt(w.b2c_dom||0)}</td>
        <td>${fmt(w.overseas)}</td>
        <td>${fmt(w.b2b_direct||0)}</td>
        <td>${fmt(w.b2b_indirect||0)}</td>
        <td>${fmt(w.b2c_ovs||0)}</td>
      </tr>`;
    });
  }
  thtml += '</table>';
  document.getElementById('detail-table').innerHTML = thtml;
}

// ─────────────────────────────────────────────
// CHANNEL TAB
// ─────────────────────────────────────────────
const TAB_LABELS = {
  dom_b2b: '국내 B2B',
  dom_b2c: '국내 B2C',
  ovs_b2b_direct: '해외 B2B 직수출',
  ovs_b2b_indirect: '해외 B2B 간접수출',
  ovs_b2c: '해외 B2C',
};

function renderChannel(tabKey) {
  const chData = DATA.channels[tabKey];
  if (!chData) { document.getElementById('main-content').innerHTML = '<p style="color:var(--muted)">데이터 없음</p>'; return; }

  const isMonthly = channelPeriod === 'monthly';
  const channels = isMonthly ? chData.monthly_channels : chData.weekly_channels;
  const totalSeries = isMonthly ? chData.monthly_total : chData.weekly_total;
  const chNames = Object.keys(channels);

  // Period keys
  const allKeys = [...new Set(Object.values(channels).flatMap(d => Object.keys(d)))].sort((a,b)=>+a-+b);
  const labels = allKeys.map(k => isMonthly ? k+'월' : 'W'+k);

  let html = `
  <div class="period-tabs" id="ch-period-tabs">
    <button class="${channelPeriod==='monthly'?'active':''}" onclick="setChPeriod('monthly','${tabKey}')">월별</button>
    <button class="${channelPeriod==='weekly'?'active':''}" onclick="setChPeriod('weekly','${tabKey}')">주별</button>
  </div>

  <!-- Total trend -->
  <div class="chart-card" style="margin-bottom:20px">
    <h3>${TAB_LABELS[tabKey]} 합계 추이</h3>
    <div class="chart-wrap" style="height:260px"><canvas id="chTotalChart"></canvas></div>
  </div>

  <!-- Channel breakdown -->
  <div class="chart-grid cols2" style="margin-bottom:20px">
    <div class="chart-card">
      <h3>채널별 추이 (상위 8개)</h3>
      <div class="chart-wrap" style="height:300px"><canvas id="chLineChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>채널 구성 비중</h3>
      <div class="chart-wrap" style="height:300px"><canvas id="chDonutChart"></canvas></div>
    </div>
  </div>

  <!-- Channel table -->
  <div class="chart-card">
    <h3>채널별 상세</h3>
    <div class="tbl-wrap"><table class="ch-tbl">
      <tr><th>채널</th>${allKeys.map(k=>isMonthly?`<th>${k}월</th>`:`<th>W${k}</th>`).join('')}<th>누계</th></tr>
  `;

  // sort by total
  const chSorted = chNames.map(n => {
    const sum = Object.values(channels[n]).reduce((s,v)=>s+v,0);
    return { name: n, sum, data: channels[n] };
  }).sort((a,b)=>b.sum-a.sum);

  chSorted.forEach(ch => {
    html += `<tr><td>${ch.name}</td>`;
    allKeys.forEach(k => { html += `<td>${ch.data[k] ? fmt(ch.data[k]) : '—'}</td>`; });
    html += `<td><strong>${fmt(ch.sum)}</strong></td></tr>`;
  });

  // Total row
  html += `<tr style="background:var(--surface2)"><td><strong>합계</strong></td>`;
  allKeys.forEach(k => { html += `<td><strong>${totalSeries[k] ? fmt(+totalSeries[k]) : '—'}</strong></td>`; });
  const grandTotal = Object.values(totalSeries).reduce((s,v)=>s+(+v),0);
  html += `<td><strong>${fmt(grandTotal)}</strong></td></tr>`;

  html += `</table></div></div>`;
  document.getElementById('main-content').innerHTML = html;

  // Draw charts
  // Total
  destroyChart('chTotalChart');
  const totalVals = allKeys.map(k => +(totalSeries[k]||0));
  charts['chTotalChart'] = new Chart(document.getElementById('chTotalChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '합계',
        data: totalVals,
        backgroundColor: '#4f7fff88',
        borderColor: '#4f7fff',
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: { ...chartOpts(), plugins: { legend: { display:false } } },
  });

  // Line (top 8)
  destroyChart('chLineChart');
  const top8 = chSorted.slice(0, 8);
  charts['chLineChart'] = new Chart(document.getElementById('chLineChart'), {
    type: 'line',
    data: {
      labels,
      datasets: top8.map((ch, i) => ({
        label: ch.name,
        data: allKeys.map(k => ch.data[k]||0),
        borderColor: CHANNEL_COLORS[i],
        backgroundColor: 'transparent',
        tension: .35, pointRadius:3, borderWidth:2,
      }))
    },
    options: { ...chartOpts(), plugins: { legend: { display:true, labels:{ color:'#7a8099', font:{size:10}, boxWidth:10 } } } },
  });

  // Donut
  destroyChart('chDonutChart');
  charts['chDonutChart'] = new Chart(document.getElementById('chDonutChart'), {
    type: 'doughnut',
    data: {
      labels: chSorted.slice(0,10).map(c=>c.name),
      datasets: [{ data: chSorted.slice(0,10).map(c=>c.sum), backgroundColor: CHANNEL_COLORS.slice(0,10), borderWidth:0, hoverOffset:8 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false, cutout:'60%',
      plugins: { legend: { position:'right', labels:{ color:'#7a8099', padding:8, font:{size:10}, boxWidth:10 } }, tooltip:{ callbacks:{ label: ctx => ' ' + fmt(ctx.raw) + ' 백만' } } }
    }
  });
}

function setChPeriod(p, tabKey) {
  channelPeriod = p;
  renderChannel(tabKey);
}

// ── Chart defaults ──
function chartOpts() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode:'index', intersect:false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1e2230',
        borderColor: '#2a2f3d',
        borderWidth: 1,
        titleColor: '#e8eaf0',
        bodyColor: '#7a8099',
        padding: 12,
        callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + fmt(ctx.raw) + ' 백만' }
      }
    },
    scales: {
      x: { grid:{ color:'#2a2f3d44' }, ticks:{ color:'#7a8099', font:{size:10} } },
      y: { grid:{ color:'#2a2f3d44' }, ticks:{ color:'#7a8099', font:{size:10}, callback: v => fmt(v) } }
    }
  };
}
</script>
</body>
</html>
