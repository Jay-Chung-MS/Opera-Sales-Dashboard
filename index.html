<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opera Sales Dashboard - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #f5f5f5;
  font-family: 'Pretendard', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.login-box {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 16px;
  padding: 48px 40px;
  width: 400px;
  text-align: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
}
.login-box h1 {
  font-size: 22px;
  font-weight: 700;
  color: #C00000;
  margin-bottom: 8px;
}
.login-box p {
  color: #666;
  font-size: 14px;
  margin-bottom: 32px;
}
.input-group {
  position: relative;
  margin-bottom: 16px;
}
.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
.input-group input:focus {
  border-color: #C00000;
}
.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 24px;
  font-size: 13px;
  color: #666;
  justify-content: center;
}
.remember input { width: auto; }
button {
  width: 100%;
  padding: 14px;
  background: #C00000;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background .2s;
}
button:hover { background: #a00000; }
.error {
  color: #CC0000;
  font-size: 13px;
  margin-top: 12px;
  display: none;
}
.lock-icon {
  font-size: 48px;
  margin-bottom: 16px;
}
</style>
</head>
<body>
<div class="login-box">
  <div class="lock-icon">&#128274;</div>
  <h1>Opera Sales Dashboard</h1>
  <p>This dashboard is password protected.</p>
  <form id="loginForm" onsubmit="return handleSubmit(event)">
    <div class="input-group">
      <input type="password" id="pwd" placeholder="Password" autofocus autocomplete="current-password">
    </div>
    <div class="remember">
      <input type="checkbox" id="remember" checked>
      <label for="remember">30&#xc77c;&#xac04; &#xae30;&#xc5b5;&#xd558;&#xae30;</label>
    </div>
    <button type="submit">&#xb85c;&#xadf8;&#xc778;</button>
    <div class="error" id="error">&#xbe44;&#xbc00;&#xbc88;&#xd638;&#xac00; &#xc62c;&#xbc14;&#xb974;&#xc9c0; &#xc54a;&#xc2b5;&#xb2c8;&#xb2e4;.</div>
  </form>
</div>

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

    const iv = Uint8Array.from(atob(encData.iv), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(encData.ct), c => c.charCodeAt(0));
    const key = await deriveKey(password, salt);
    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv }, key, ct
    );
    return new TextDecoder().decode(decrypted);
  } catch(e) {
    return null;
  }
}

async function handleSubmit(e) {
  e.preventDefault();
  const pwd = document.getElementById('pwd').value;
  const html = await decrypt(pwd);
  if (html) {
    if (document.getElementById('remember').checked) {
      const expires = new Date(Date.now() + 30*24*60*60*1000).toUTCString();
      document.cookie = "staticrypt_token=" + btoa(pwd) + ";expires=" + expires + ";path=/;SameSite=Strict";
    }
    document.open();
    document.write(html);
    document.close();
  } else {
    document.getElementById('error').style.display = 'block';
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
  }
  return false;
}

// Auto-login from cookie
(async function() {
  const match = document.cookie.match(/staticrypt_token=([^;]+)/);
  if (match) {
    const pwd = atob(match[1]);
    const html = await decrypt(pwd);
    if (html) {
      document.open();
      document.write(html);
      document.close();
    }
  }
})();
</script>
