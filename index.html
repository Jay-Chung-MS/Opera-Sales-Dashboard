<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전사 매출 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d47;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --text-muted: #64748b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }

  /* Loading */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text-muted); font-size: 14px; }

  /* Header */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .header-left h1 {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #e2e8f0 0%, #3b82f6 60%, #06b6d4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-left p { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }

  .view-toggle { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
  .view-btn { padding: 6px 16px; border: none; border-radius: 5px; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; color: var(--text-muted); background: transparent; transition: all 0.2s; font-weight: 500; }
  .view-btn.active { background: var(--accent); color: #fff; }

  /* KPI */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; overflow: hidden; transition: border-color 0.2s; }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.2s; }
  .kpi-card:hover::before { opacity: 1; }
  .kpi-card:hover { border-color: var(--accent); }
  .kpi-label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 900; font-family: 'JetBrains Mono', monospace; color: var(--text); line-height: 1; margin-bottom: 8px; }
  .kpi-value span { font-size: 14px; font-weight: 400; color: var(--text-muted); }
  .kpi-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; padding: 3px 8px; border-radius: 4px; }
  .badge-up { background: rgba(16,185,129,0.15); color: var(--success); }
  .badge-down { background: rgba(239,68,68,0.15); color: var(--danger); }
  .badge-neutral { background: rgba(100,116,139,0.15); color: var(--text-muted); }

  /* MTD */
  .mtd-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 3px; height: 14px; background: linear-gradient(to bottom, var(--accent), var(--accent2)); border-radius: 2px; }
  .mtd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .mtd-item { background: var(--surface2); border-radius: 8px; padding: 16px; border: 1px solid var(--border); }
  .mtd-item-label { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .mtd-nums { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .mtd-actual { font-size: 18px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text); }
  .mtd-target { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .progress-bar { height: 5px; background: var(--border); border-radius: 3px; margin-bottom: 6px; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }
  .progress-pct { font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; text-align: right; }

  /* Charts */
  .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .chart-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .chart-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .legend { display: flex; gap: 16px; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Table */
  .weekly-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .table-wrapper { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: right; padding: 8px 12px; font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child { text-align: left; }
  td { text-align: right; padding: 10px 12px; border-bottom: 1px solid rgba(30,45,71,0.5); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); white-space: nowrap; }
  td:first-child { text-align: left; font-family: 'Noto Sans KR', sans-serif; font-weight: 600; font-size: 12px; color: var(--text-muted); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(59,130,246,0.04); }
  .td-pos { color: var(--success); }
  .td-neg { color: var(--danger); }
  .td-total { color: var(--accent); font-weight: 700; }

  .notes { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .note-badge { font-size: 10px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; }

  .view-panel { display: none; }
  .view-panel.active { display: block; }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-grid { grid-template-columns: 1fr; }
    .mtd-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p>데이터 불러오는 중...</p>
  </div>

  <!-- Dashboard (hidden until data loads) -->
  <div id="dashboard" style="display:none">
    <header>
      <div class="header-left">
        <h1>전사 매출 대시보드</h1>
        <p id="last-update"></p>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" onclick="switchView('monthly', event)">월별</button>
        <button class="view-btn" onclick="switchView('weekly', event)">주별</button>
      </div>
    </header>

    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="mtd-section">
      <div class="section-title" id="mtd-title">MTD 목표 달성 현황</div>
      <div class="mtd-grid" id="mtd-grid"></div>
    </div>

    <div class="view-panel active" id="panel-monthly">
      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-header">
            <div><div class="chart-title">월별 매출 추이</div><div class="chart-subtitle">전체 / 국내 / 해외</div></div>
            <div class="legend">
              <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>합계</div>
              <div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div>국내</div>
              <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>해외</div>
            </div>
          </div>
          <canvas id="monthly-trend" height="200"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-header"><div><div class="chart-title">국내/해외 비중</div><div class="chart-subtitle">최근 12개월 누계</div></div></div>
          <canvas id="pie-chart" height="200"></canvas>
        </div>
      </div>
      <div class="chart-card" style="margin-bottom:20px">
        <div class="chart-header">
          <div><div class="chart-title">MoM / YoY 증감률</div><div class="chart-subtitle">(%)</div></div>
          <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div>MoM</div>
            <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>YoY</div>
          </div>
        </div>
        <canvas id="growth-chart" height="120"></canvas>
      </div>
      <div class="weekly-section">
        <div class="section-title">월별 상세 데이터</div>
        <div class="table-wrapper"><table id="monthly-table"></table></div>
      </div>
    </div>

    <div class="view-panel" id="panel-weekly">
      <div class="chart-card" style="margin-bottom:20px">
        <div class="chart-header">
          <div><div class="chart-title">주별 매출 추이 (2025–2026)</div><div class="chart-subtitle">ISO Week 기준</div></div>
          <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>합계</div>
            <div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div>국내</div>
            <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>해외</div>
          </div>
        </div>
        <canvas id="weekly-trend" height="150"></canvas>
      </div>
      <div class="weekly-section">
        <div class="section-title">주별 상세 데이터</div>
        <div class="table-wrapper"><table id="weekly-table"></table></div>
      </div>
    </div>

    <div class="notes">
      <span class="note-badge">단위: 백만원</span>
      <span class="note-badge">국내 B2B: 반품 포함 기준</span>
      <span class="note-badge">해외 B2B 직수출: 선적 시점 매출 인식</span>
      <span class="note-badge">국내 B2C: 수수료 포함</span>
    </div>
  </div>
</div>

<script>
const fmt = v => v ? v.toLocaleString('ko-KR', {minimumFractionDigits:1, maximumFractionDigits:1}) : '-';
const fmtPct = v => v !== null && v !== undefined ? `${v > 0 ? '+' : ''}${v.toFixed(1)}%` : '-';

const CHART_DEFAULTS = {
  responsive: true,
  interaction: { mode: 'index', intersect: false },
  plugins: {
    legend: { display: false },
    tooltip: {
      backgroundColor: '#1a2235', borderColor: '#1e2d47', borderWidth: 1,
      titleColor: '#94a3b8', bodyColor: '#e2e8f0', padding: 10,
      callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y !== undefined ? ctx.parsed.y.toLocaleString('ko-KR', {minimumFractionDigits:1}) : '-'}` }
    }
  },
  scales: {
    x: { grid: { color: 'rgba(30,45,71,0.5)' }, ticks: { color: '#64748b', font: { size: 10 } } },
    y: { grid: { color: 'rgba(30,45,71,0.5)' }, ticks: { color: '#64748b', font: { size: 10 }, callback: v => v.toLocaleString('ko-KR') } }
  }
};

let MONTHLY = [], WEEKLY = [], MTD = {};
let charts = {};

function renderKPI() {
  const recent = MONTHLY.filter(d => d.total > 0).slice(-1)[0];
  const ytd2025 = MONTHLY.filter(d => d.year === 2025).reduce((s,d) => s+d.total, 0);
  const ytd2024 = MONTHLY.filter(d => d.year === 2024).reduce((s,d) => s+d.total, 0);
  const ytdGrowth = ((ytd2025 - ytd2024) / ytd2024 * 100).toFixed(1);
  const wk2026 = WEEKLY.filter(d => d.year === 2026);
  const avgWeekly = wk2026.length ? Math.round(wk2026.reduce((s,d)=>s+d.total,0) / wk2026.length) : 0;
  const mtdAchieve = MTD['합계'] ? MTD['합계'].progress : 0;

  const cards = [
    { label: '최근월 총 매출', value: fmt(recent.total), unit: '백만원', badge: fmtPct(recent.mom), badgeType: recent.mom >= 0 ? 'up' : 'down', sub: `${recent.label} MoM` },
    { label: '2025 누계 매출', value: fmt(ytd2025), unit: '백만원', badge: `vs 2024: ${ytdGrowth > 0 ? '+' : ''}${ytdGrowth}%`, badgeType: ytdGrowth >= 0 ? 'up' : 'down', sub: '2024년 대비' },
    { label: 'MTD 달성률', value: `${mtdAchieve}`, unit: '%', badge: mtdAchieve >= 100 ? '목표 달성' : '목표 미달', badgeType: mtdAchieve >= 100 ? 'up' : 'down', sub: 'MTD 기준' },
    { label: '2026 주평균 매출', value: avgWeekly.toLocaleString(), unit: '백만원', badge: '2026 YTD', badgeType: 'neutral', sub: `${wk2026.length}주 평균` },
  ];

  document.getElementById('kpi-grid').innerHTML = cards.map(c => `
    <div class="kpi-card">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.value} <span>${c.unit}</span></div>
      <div class="kpi-badge badge-${c.badgeType}">${c.badge}</div>
      <div style="font-size:10px;color:var(--text-muted);margin-top:6px">${c.sub}</div>
    </div>
  `).join('');
}

function renderMTD() {
  const keys = ['합계','국내','B2B(국내)','B2C(국내)','해외','B2B직수출','B2B간접수출','B2C(해외)'];
  document.getElementById('mtd-grid').innerHTML = keys.filter(k => MTD[k]).map(k => {
    const d = MTD[k];
    const pct = d.progress;
    const color = pct >= 100 ? 'var(--success)' : pct >= 80 ? 'var(--warning)' : 'var(--danger)';
    return `
      <div class="mtd-item">
        <div class="mtd-item-label">${k}</div>
        <div class="mtd-nums">
          <div class="mtd-actual">${fmt(d.mtd)}</div>
          <div class="mtd-target">목표 ${fmt(d.target)}</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(pct/1.3*100, 100)}%;background:${color}"></div></div>
        <div class="progress-pct" style="color:${color}">${pct.toFixed(1)}%</div>
      </div>
    `;
  }).join('');
}

function destroyCharts() {
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

function renderMonthlyCharts() {
  charts.trend = new Chart(document.getElementById('monthly-trend'), {
    type: 'bar',
    data: {
      labels: MONTHLY.map(d => d.label),
      datasets: [
        { label: '합계', data: MONTHLY.map(d=>d.total), backgroundColor: 'rgba(59,130,246,0.7)', borderColor: '#3b82f6', borderWidth: 1, borderRadius: 3, order: 2 },
        { label: '국내', data: MONTHLY.map(d=>d.domestic||null), type: 'line', borderColor: '#06b6d4', backgroundColor: 'transparent', pointRadius: 2, borderWidth: 2, tension: 0.3, order: 1 },
        { label: '해외', data: MONTHLY.map(d=>d.overseas||null), type: 'line', borderColor: '#8b5cf6', backgroundColor: 'transparent', pointRadius: 2, borderWidth: 2, tension: 0.3, order: 0 },
      ]
    },
    options: CHART_DEFAULTS
  });

  const last12 = MONTHLY.filter(d => d.domestic > 0 || d.overseas > 0).slice(-12);
  const domSum = last12.reduce((s,d) => s+d.domestic, 0);
  const ovsSum = last12.reduce((s,d) => s+d.overseas, 0);

  charts.pie = new Chart(document.getElementById('pie-chart'), {
    type: 'doughnut',
    data: {
      labels: ['국내', '해외'],
      datasets: [{ data: [domSum, ovsSum], backgroundColor: ['#3b82f6','#8b5cf6'], borderColor: '#111827', borderWidth: 3 }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { color: '#94a3b8', font: { size: 11 }, padding: 16 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed.toLocaleString('ko-KR', {minimumFractionDigits:1})} (${(ctx.parsed/(domSum+ovsSum)*100).toFixed(1)}%)` } }
      },
      cutout: '65%'
    }
  });

  const gd = MONTHLY.filter(d => d.mom !== null || d.yoy !== null);
  charts.growth = new Chart(document.getElementById('growth-chart'), {
    type: 'bar',
    data: {
      labels: gd.map(d=>d.label),
      datasets: [
        { label: 'MoM', data: gd.map(d=>d.mom), backgroundColor: gd.map(d => d.mom >= 0 ? 'rgba(6,182,212,0.7)' : 'rgba(239,68,68,0.5)'), borderRadius: 2 },
        { label: 'YoY', data: gd.map(d=>d.yoy), backgroundColor: gd.map(d => d.yoy >= 0 ? 'rgba(245,158,11,0.7)' : 'rgba(239,68,68,0.4)'), borderRadius: 2 },
      ]
    },
    options: { ...CHART_DEFAULTS, scales: { ...CHART_DEFAULTS.scales, y: { ...CHART_DEFAULTS.scales.y, ticks: { ...CHART_DEFAULTS.scales.y.ticks, callback: v => v + '%' } } } }
  });
}

function renderWeeklyCharts() {
  charts.weekly = new Chart(document.getElementById('weekly-trend'), {
    type: 'line',
    data: {
      labels: WEEKLY.map(d => d.label),
      datasets: [
        { label: '합계', data: WEEKLY.map(d=>d.total), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', pointRadius: 0, borderWidth: 2, fill: true, tension: 0.3 },
        { label: '국내', data: WEEKLY.map(d=>d.domestic), borderColor: '#06b6d4', backgroundColor: 'transparent', pointRadius: 0, borderWidth: 1.5, tension: 0.3 },
        { label: '해외', data: WEEKLY.map(d=>d.overseas), borderColor: '#8b5cf6', backgroundColor: 'transparent', pointRadius: 0, borderWidth: 1.5, tension: 0.3 },
      ]
    },
    options: CHART_DEFAULTS
  });
}

function renderMonthlyTable() {
  document.getElementById('monthly-table').innerHTML = `<thead><tr>
    <th>기간</th><th>합계</th><th>국내</th><th>해외</th>
    <th>B2B(국내)</th><th>B2C(국내)</th><th>B2B직수출</th><th>B2B간접수출</th><th>B2C(해외)</th>
    <th>MoM</th><th>YoY</th>
  </tr></thead><tbody>${MONTHLY.map(d => `
    <tr>
      <td>${d.label}</td>
      <td class="td-total">${fmt(d.total)}</td>
      <td>${d.domestic ? fmt(d.domestic) : '-'}</td>
      <td>${d.overseas ? fmt(d.overseas) : '-'}</td>
      <td>${d.b2b_dom ? fmt(d.b2b_dom) : '-'}</td>
      <td>${d.b2c_dom ? fmt(d.b2c_dom) : '-'}</td>
      <td>${d.b2b_direct ? fmt(d.b2b_direct) : '-'}</td>
      <td>${d.b2b_indirect ? fmt(d.b2b_indirect) : '-'}</td>
      <td>${d.b2c_ovs ? fmt(d.b2c_ovs) : '-'}</td>
      <td class="${d.mom !== null ? (d.mom >= 0 ? 'td-pos' : 'td-neg') : ''}">${fmtPct(d.mom)}</td>
      <td class="${d.yoy !== null ? (d.yoy >= 0 ? 'td-pos' : 'td-neg') : ''}">${fmtPct(d.yoy)}</td>
    </tr>`).join('')}</tbody>`;
}

function renderWeeklyTable() {
  document.getElementById('weekly-table').innerHTML = `<thead><tr>
    <th>기간</th><th>합계</th><th>국내</th><th>해외</th>
  </tr></thead><tbody>${WEEKLY.map(d => `
    <tr>
      <td>${d.label}</td>
      <td class="td-total">${fmt(d.total)}</td>
      <td>${fmt(d.domestic)}</td>
      <td>${fmt(d.overseas)}</td>
    </tr>`).join('')}</tbody>`;
}

function switchView(view, e) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(`panel-${view}`).classList.add('active');
  destroyCharts();
  if (view === 'monthly') renderMonthlyCharts();
  else renderWeeklyCharts();
}

// ── 핵심: data.json을 외부에서 fetch ──
async function loadAndRender() {
  try {
    const res = await fetch('data.json?v=' + Date.now()); // 캐시 방지
    if (!res.ok) throw new Error('data.json 로드 실패');
    const data = await res.json();

    MONTHLY = data.monthly || [];
    WEEKLY  = data.weekly  || [];
    MTD     = data.mtd     || {};

    const lastMonth = MONTHLY.filter(d => d.total > 0).slice(-1)[0];
    document.getElementById('last-update').textContent =
      `최근 데이터: ${lastMonth.label} | 단위: 백만원 | 업데이트: ${new Date().toLocaleDateString('ko-KR')}`;

    // MTD 제목에 기준월 표시
    const mtdMonth = MONTHLY.filter(d=>d.total>0).slice(-1)[0];
    document.getElementById('mtd-title').textContent =
      `MTD 목표 달성 현황 (${mtdMonth.year}년 ${mtdMonth.month}월 기준)`;

    renderKPI();
    renderMTD();
    renderMonthlyCharts();
    renderMonthlyTable();
    renderWeeklyTable();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  } catch(err) {
    document.getElementById('loading').innerHTML =
      `<div style="color:#ef4444;font-size:14px">⚠️ 데이터 로드 실패: ${err.message}</div>
       <p style="color:#64748b;font-size:12px;margin-top:8px">data.json 파일이 같은 폴더에 있는지 확인하세요.</p>`;
  }
}

document.addEventListener('DOMContentLoaded', loadAndRender);
</script>
</body>
</html>
